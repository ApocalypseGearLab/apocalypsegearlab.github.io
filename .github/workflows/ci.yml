name: Validate Astro site

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/astro-foundation, feat/phase3-blackout-visual-assets, 'content/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:images
      - run: npm run test:products
      - run: npm run build
      - run: npm run test:site
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
